name: Tests

on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "docs/*.js", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt pyyaml
      - run: python -m unittest discover -s tests -t . -v
      - run: node --test docs/test_lib.js
