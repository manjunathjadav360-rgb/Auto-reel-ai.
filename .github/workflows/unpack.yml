name: Unpack

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit if archive is present
        run: |
          if [ ! -f autoreel-app.zip ]; then
            echo "Application source is already extracted; nothing to do."
            exit 0
          fi
          unzip -o autoreel-app.zip
          rm -f autoreel-app.zip
          rm -rf __MACOSX
          git config user.name "autoreel-bot"
          git config user.email "autoreel-bot@users.noreply.github.com"
          git add -A
          git commit -m "Add AUTO REEL AI application source"
          git push
