name: Unpack

# One-time helper: unzips autoreel-app.zip (uploaded to the repo root) into the repository.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and commit
        run: |
          test -f autoreel-app.zip || { echo "::error::Upload autoreel-app.zip to the repository root first."; exit 1; }
          unzip -o autoreel-app.zip
          rm -f autoreel-app.zip
          rm -rf __MACOSX
          git config user.name "autoreel-bot"
          git config user.email "autoreel-bot@users.noreply.github.com"
          git add -A
          git commit -m "Add AUTO REEL AI application"
          git push
